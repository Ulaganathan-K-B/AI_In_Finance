name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU-only PyTorch (Linux; the Windows wheel is already CPU-only)
        if: runner.os == 'Linux'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Smoke test - synthetic experiment with 2 worker processes
        run: python scripts/run_synthetic.py configs/synthetic.yaml --quick --processes 2
      - name: Smoke test - walk-forward on the cached prices with 2 worker processes
        run: python scripts/run_walkforward.py configs/sector9.yaml --quick --processes 2
