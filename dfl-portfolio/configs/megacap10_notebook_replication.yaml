# Reproduces the preliminary notebook's decision-focused set-up to show why it did not train:
# lambda = 1, cap 0.3, mean-return loss, default (large) initialisation, no warm start.
name: megacap10_notebook_replication
universe: megacap10
seeds: 5
backtest_cost: 0.001
layer: {lam: 1.0, lower: 0.0, upper: 0.3, eta: 0.0}
walkforward: {first_test_year: 2017, val_weeks: 52, embargo: 1, min_train: 100}
train: {lr: 0.001, weight_decay: 0.0001, epochs: 100, patience: 100, min_epochs: 100, cost: 0.0}
methods:
  - {name: pf_mlp, model: mlp, loss: mse, patience: 40, min_epochs: 20}
  - {name: dfl_notebook_style, model: mlp, loss: return, compare_to: pf_mlp,
     model_kwargs: {small_init: false, skip_linear: false, dropout: 0.0, hidden: [64, 32], output_scale: 1.0}}
  - {name: dfl_fixed, model: mlp, loss: utility, init: pf_mlp, compare_to: pf_mlp, patience: 40, min_epochs: 20}
