# Paper-quality extension: risk-constrained / distributionally robust decision losses.
# Run both as a walk-forward and as a frozen model (trained 2000-2005, never refit, tested 2007-2025).
name: robust_sector9
universe: sector9
seeds: 5
backtest_cost: 0.001
layer: {lam: 5.0, lower: 0.0, upper: 0.3, eta: 0.0}
walkforward: {first_test_year: 2007, val_weeks: 52, embargo: 1, min_train: 156}
train: {lr: 0.001, weight_decay: 0.0001, epochs: 300, patience: 40, min_epochs: 20, cost: 0.001}
methods:
  - {name: pf_mlp,           model: mlp, loss: mse}
  - {name: dfl_mlp,          model: mlp, loss: utility,  init: pf_mlp}
  - {name: dfl_mlp_sharpe,   model: mlp, loss: sharpe,   init: pf_mlp}
  - {name: dfl_mlp_cvar,     model: mlp, loss: cvar,     init: pf_mlp, kappa: 1.0, alpha: 0.9}
  - {name: dfl_mlp_dro,      model: mlp, loss: dro,      init: pf_mlp, radius: 0.003}
  - {name: dfl_mlp_groupdro, model: mlp, loss: groupdro, init: pf_mlp}
