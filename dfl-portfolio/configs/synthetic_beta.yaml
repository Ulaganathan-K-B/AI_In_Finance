# Research question 3: the forecast-calibration vs decision-quality trade-off (hybrid loss beta sweep).
name: synthetic_beta
degrees: [1, 6]
n_train: [300]
seeds: 10
n_val: 200
n_test: 2000
spec: {n_assets: 10, n_features: 5, signal_sd: 0.005, mean: 0.002, factor_vol: 0.02, idio_vol: 0.03}
layer: {lam: 10.0, lower: 0.0, upper: 0.4}
train: {lr: 0.001, weight_decay: 0.0001, epochs: 300, patience: 50, min_epochs: 20, cost: 0.0}
methods:
  - {name: pf_linear,       model: linear, loss: mse}
  - {name: dfl_linear,      model: linear, loss: utility, init: pf_linear}
  - {name: hyb_b1,          model: linear, loss: utility, init: pf_linear, beta: 1.0}
  - {name: hyb_b10,         model: linear, loss: utility, init: pf_linear, beta: 10.0}
  - {name: hyb_b100,        model: linear, loss: utility, init: pf_linear, beta: 100.0}
  - {name: hyb_b1000,       model: linear, loss: utility, init: pf_linear, beta: 1000.0}
  - {name: hyb_b10000,      model: linear, loss: utility, init: pf_linear, beta: 10000.0}
