# Secondary experiment: the ten stocks from the preliminary notebook (hindsight-selected).
name: megacap10_main
universe: megacap10
seeds: 5
cov_window: 104
hist_window: 156
backtest_cost: 0.001
layer: {lam: 5.0, lower: 0.0, upper: 0.3, eta: 0.0}
walkforward: {first_test_year: 2017, val_weeks: 52, embargo: 1, min_train: 100}
train: {lr: 0.001, weight_decay: 0.0001, epochs: 300, patience: 40, min_epochs: 20, cost: 0.001}
methods:
  - {name: pf_linear,   model: linear, loss: mse}
  - {name: pf_mlp,      model: mlp,    loss: mse}
  - {name: dfl_linear,  model: linear, loss: utility, init: pf_linear}
  - {name: dfl_mlp,     model: mlp,    loss: utility, init: pf_mlp}
  - {name: hybrid_mlp,  model: mlp,    loss: utility, init: pf_mlp, beta: 100.0, compare_to: pf_mlp}
